<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Islamic Companion</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0e27">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <style>
    :root { --bg:#0a0e27; --card:#141a38; --border:#2a3157; --gold:#f1c40f; --text:#f2f3f7; --muted:#aab0c6; --emerald:#10b981; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(circle at 20% 10%, #16204a 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; text-align:center;
    }
    .card {
      max-width: 520px; width: 100%; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px; padding: 40px 28px;
    }
    .icon { font-size: 56px; line-height: 1; margin-bottom: 14px; }
    h1 { font-size: 1.6rem; margin: 0 0 10px; font-family: Georgia, "Times New Roman", serif; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; font-size: .95rem; }
    .code { color: var(--gold); font-weight: 600; }
    a.btn {
      display: inline-block; text-decoration: none; padding: 12px 22px; border-radius: 999px;
      border: 1px solid var(--emerald); color: var(--emerald); font-weight: 600; font-size: .95rem;
      margin: 4px;
    }
    a.btn.primary { background: var(--emerald); color: #04120c; }
    .links { margin-top: 18px; }
  </style>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8105508666234797"

</head>
<body>
  <main class="card">
    <div class="icon">🕌</div>
    <h1>This page wandered off</h1>
    <p>
      We couldn't find that page <span class="code">(404)</span>.<br>
      It may have moved, or the link may be mistyped.
    </p>
    <div class="links">
      <a class="btn primary" href="/">🏠 Back to the app</a>
      <a class="btn" href="/?tab=prayer#prayer">🕌 Prayer times</a>
      <a class="btn" href="/?tab=quran#quran">📖 Quran</a>

</html>
