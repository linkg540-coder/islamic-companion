<!DOCTYPE html><html><body style="background:#111;color:#0f0;font-family:monospace;padding:20px">
<pre id="o">checking…</pre>
<script>
(async () => {
  const out = [];
  try {
    const names = await caches.keys();
    out.push('caches: ' + names.join(', '));
    for (const n of names) {
      const c = await caches.open(n);
      const keys = await c.keys();
      const hit = keys.filter(k => /adhan\.mp3/.test(k.url));
      out.push(n + ': ' + keys.length + ' entries' + (hit.length ? '  ADHAN CACHED -> ' + hit[0].url : ''));
    }
    const m = await caches.match('audio/adhan.mp3');
    out.push('match(audio/adhan.mp3): ' + (m ? 'HIT ' + m.status : 'miss'));
  } catch (e) { out.push('ERR ' + e.message); }
  document.getElementById('o').textContent = out.join('\n');
})();
</script></body></html>
