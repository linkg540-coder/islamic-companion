<!DOCTYPE html><html><head><meta charset="utf-8"><title>verify</title></head>
<body style="font-family:monospace;background:#121226;color:#eee;padding:20px">
<h3>offline + push verification</h3><pre id="out">working…</pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
(async () => {
  out.textContent = '';
  log('origin: ' + location.origin);
  log('controller: ' + (navigator.serviceWorker.controller ? 'yes' : 'NO'));
  const reg = await navigator.serviceWorker.ready;
  log('sw: ' + reg.active.state + ' ' + new URL(reg.active.scriptURL).pathname);
  // push still alive after the sw.js rewrite?
  try {
    const ps = await reg.pushManager.getSubscription();
    log('push subscription: ' + (ps ? 'ALIVE -> ' + new URL(ps.endpoint).hostname : 'MISSING'));
    if (ps) log('  expires: ' + (ps.expirationTime ? new Date(ps.expirationTime).toISOString() : 'no expiry'));
  } catch (e) { log('push check error: ' + e.message); }
  // cache inventory
  const names = await caches.keys();
  log('cache names: ' + JSON.stringify(names));
  let total = 0;
  for (const n of names) {
    const keys = await (await caches.open(n)).keys();
    total += keys.length;
    log('  ' + n + ' (' + keys.length + ')');
    for (const k of keys.slice(0, 8)) log('     ' + k.url.replace('https://', '').slice(0, 90));
  }
  log('total cached: ' + total);
  // is the cached shell the real app, and does it carry the offline UI?
  const sh = await caches.open('ic-v2-shell');
  const idx = await sh.match('./index.html');
  if (idx) {
    const t = await idx.text();
    log('shell: ' + t.length + ' chars | title ok: ' + t.includes('Islamic Companion') +
        ' | offline chip: ' + t.includes('icOfflineChip') +
        ' | prayer grid: ' + t.includes('prayerTimes'));
  } else log('shell: MISSING');
  // live API state
  for (const u of ['https://api.aladhan.com/v1/timings?latitude=41.56&longitude=-72.65&method=2&school=0&latitudeAdjustmentMethod=1',
                   'https://api.alquran.cloud/v1/surah/1/quran-uthmani']) {
    try { const r = await fetch(u); log('live ' + new URL(u).hostname + ': ' + r.status); }
    catch (e) { log('live ' + new URL(u).hostname + ': FAILED'); }
  }
  await new Promise(r => setTimeout(r, 1500));
  const q = await caches.open('ic-v2-quran');
  log('quran cache after live calls: ' + (await q.keys()).length + ' entries');
  // saved prayer times (the offline render source)
  try {
    const raw = localStorage.getItem('ic_lastTimings');
    if (!raw) log('ic_lastTimings: MISSING');
    else {
      const s = JSON.parse(raw);
      log('ic_lastTimings: ' + Math.round(raw.length / 1024) + 'KB | age ' + ((Date.now() - s.at) / 60000).toFixed(1) + ' min');
      log('  label: ' + s.label + ' | tz: ' + s.tz);
      log('  Fajr ' + (s.data && s.data.timings && s.data.timings.Fajr) + ' / Isha ' + (s.data && s.data.timings && s.data.timings.Isha) +
          ' | hijri ' + (s.data && s.data.date && s.data.date.hijri ? s.data.date.hijri.day + ' ' + s.data.date.hijri.month.en : 'n/a'));
    }
  } catch (e) { log('ic_lastTimings error: ' + e.message); }
  log('DONE');
})().catch(e => log('ERROR: ' + e.message));
</script></body></html>
