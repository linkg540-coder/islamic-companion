<!DOCTYPE html><html><head><meta charset="utf-8"><title>cache check</title></head>
<body style="font-family:monospace;background:#121226;color:#eee;padding:20px">
<h3>offline cache check</h3><pre id="out">working…</pre>
<script>
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };
async function stats(){
  const names = await caches.keys();
  const o = {};
  for (const n of names) o[n] = (await (await caches.open(n)).keys()).length;
  return o;
}
(async () => {
  out.textContent = 'sw supported: ' + ('serviceWorker' in navigator);
  const reg = await navigator.serviceWorker.ready;
  log('sw scope: ' + reg.scope);
  log('sw active: ' + (reg.active ? reg.active.state : 'none'));
  log('script: ' + (reg.active && reg.active.scriptURL));
  log('caches after install: ' + JSON.stringify(await stats()));
  const shell = await caches.open('ic-v2-shell');
  const idx = await shell.match('./index.html');
  log('index.html cached: ' + !!idx + (idx ? ' (' + (await idx.text()).length + ' bytes)' : ''));
  // pull one surah through the SW so it lands in the quran cache
  const r = await fetch('https://api.alquran.cloud/v1/surah/112/quran-uthmani');
  log('surah 112 fetched: ' + r.status);
  await new Promise(res => setTimeout(res, 1200));
  log('caches after a surah: ' + JSON.stringify(await stats()));
  const q = await caches.open('ic-v2-quran');
  const hit = await q.match('https://api.alquran.cloud/v1/surah/112/quran-uthmani');
  log('surah 112 offline copy: ' + !!hit);
  if (hit) { const j = await hit.json(); log('cached ayahs: ' + j.data.ayahs.length + ' (' + j.data.englishName + ')'); }
  log('DONE');
})().catch(e => log('ERROR: ' + e.message));
</script></body></html>
