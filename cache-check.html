<!DOCTYPE html><html><head><meta charset="utf-8"><title>cache check</title></head>
<body style="font-family:monospace;background:#121226;color:#eee;padding:20px">
<h3>offline cache report</h3><pre id="out">working…</pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
(async () => {
  out.textContent = '';
  const reg = await navigator.serviceWorker.ready;
  log('origin: ' + location.origin);
  log('sw: ' + reg.active.state + ' | ' + reg.active.scriptURL);
  const names = await caches.keys();
  const o = {};
  for (const n of names) o[n] = (await (await caches.open(n)).keys()).length;
  log('caches: ' + JSON.stringify(o));
  const shell = await caches.open('ic-v2-shell');
  const idx = await shell.match('./index.html');
  const t = idx ? await idx.text() : '';
  log('shell index.html: ' + (idx ? t.length + ' chars, isApp=' + (t.includes('Islamic Companion') && t.length > 500000) : 'MISSING'));
  const q = await caches.open('ic-v2-quran');
  const keys = (await q.keys()).map(r => r.url.replace('https://', '').slice(0, 60));
  log('quran cache (' + keys.length + '):');
  keys.slice(0, 6).forEach(k => log('   ' + k));
  log('DONE');
})().catch(e => log('ERROR: ' + e.message));
</script></body></html>
